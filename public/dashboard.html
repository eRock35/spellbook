<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spellbook Analytics</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --fill:rgba(120,120,128,0.12);
    --label:#000; --label-2:rgba(60,60,67,0.6); --label-3:rgba(60,60,67,0.4);
    --sep:rgba(60,60,67,0.22);
    --tint:#5856D6; --red:#FF3B30; --green:#34C759;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 24px rgba(0,0,0,.06);

    /* Chart surface and ink kept separate from the app's chrome tokens, so a
       chart never inherits a colour that was chosen for a button. */
    --surface-1:#FFFFFF;
    --viz-text:rgba(60,60,67,0.85);
    --viz-muted:rgba(60,60,67,0.55);
    --viz-grid:rgba(60,60,67,0.12);
    --viz-axis:rgba(60,60,67,0.30);

    /* Categorical slots 1-5 of the validated default palette, light steps.
       Assigned to apps in a FIXED order (see APP_ORDER) and never by rank —
       a filter or a reshuffle must not repaint the survivors. */
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    --series-4:#eda100; --series-5:#e87ba4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000; --card:#1C1C1E; --fill:rgba(120,120,128,0.24);
      --label:#fff; --label-2:rgba(235,235,245,0.6); --label-3:rgba(235,235,245,0.4);
      --sep:rgba(84,84,88,0.5);
      --tint:#7D7AFF; --red:#FF453A; --green:#32D74B;

      --surface-1:#1C1C1E;
      --viz-text:rgba(235,235,245,0.9);
      --viz-muted:rgba(235,235,245,0.6);
      --viz-grid:rgba(235,235,245,0.14);
      --viz-axis:rgba(235,235,245,0.32);

      /* The same five hues re-stepped for the dark surface — a selected dark
         palette, not an automatic flip of the light one. */
      --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
      --series-4:#c98500; --series-5:#d55181;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--label); margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    padding-inline:16px; padding-block:20px 80px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:16px;}
  .eyebrow{font-size:13px; font-weight:600; color:var(--tint); text-transform:uppercase; letter-spacing:.02em; margin:0 0 2px;}
  h1{font-size:27px; font-weight:700; letter-spacing:-.02em; margin:0;}
  h2{font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0;}
  .sub{color:var(--label-2); font-size:13.5px; margin:5px 0 0; line-height:1.45;}
  .back-btn{background:none; border:none; color:var(--tint); font:inherit; font-size:15px; font-weight:600; padding:0; cursor:pointer;}
  .card{background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:18px;}
  .section-header{font-size:13px; font-weight:600; color:var(--label-2); text-transform:uppercase; letter-spacing:.02em; margin:4px 4px 0;}
  p{margin:0; font-size:15px; line-height:1.45;}
  .muted{color:var(--label-2); font-size:13px;}

  /* Stat tiles — a hero number needs no plot, so these carry no chart. */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px;}
  .tile{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:15px 16px;}
  .tile .k{font-size:12px; font-weight:600; color:var(--label-2); text-transform:uppercase; letter-spacing:.03em;}
  .tile .v{font-size:29px; font-weight:700; letter-spacing:-.02em; margin-top:4px; font-variant-numeric:tabular-nums;}
  .tile .d{font-size:12.5px; color:var(--label-2); margin-top:2px;}
  .delta.up{color:var(--green); font-weight:600;} .delta.down{color:var(--red); font-weight:600;}

  /* Filters in one row above the charts. */
  .charthead{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
  .controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .segmented{display:flex; background:var(--fill); border-radius:9px; padding:2px; gap:2px;}
  .segmented button{border:none; background:none; color:var(--label-2); font:inherit; font-size:12.5px;
    font-weight:600; padding:6px 11px; border-radius:7px; cursor:pointer;}
  .segmented button[aria-pressed="true"]{background:var(--card); color:var(--label); box-shadow:0 1px 2px rgba(0,0,0,.12);}

  /* Legend: always present at two or more series, and the only place a series
     colour appears next to text — the text itself stays in an ink token. */
  .legend{display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:12px;}
  .legend button{display:flex; align-items:center; gap:7px; background:none; border:none; padding:3px 0;
    font:inherit; font-size:12.5px; color:var(--viz-text); cursor:pointer;}
  .legend button[aria-pressed="false"]{opacity:.38;}
  .legend .sw{width:11px; height:11px; border-radius:3px; flex:0 0 auto;}
  .legend .lv{color:var(--viz-muted); font-variant-numeric:tabular-nums;}

  .chartbox{position:relative; margin-top:6px;}
  svg{display:block; width:100%; height:auto; overflow:visible;}
  .tip{
    position:absolute; pointer-events:none; opacity:0; transition:opacity .09s;
    background:var(--card); color:var(--label); border:1px solid var(--sep); border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,.18); padding:8px 10px; font-size:12.5px; min-width:132px; z-index:5;
  }
  .tip .th{font-weight:700; margin-bottom:5px; font-size:12px; color:var(--viz-muted);}
  .tip .tr{display:flex; align-items:center; gap:7px; line-height:1.7; white-space:nowrap;}
  .tip .tr .sw{width:9px; height:9px; border-radius:2px; flex:0 0 auto;}
  .tip .tr .tv{margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--sep);}
  th{font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--label-2); font-weight:600;}
  td.n,th.n{text-align:right; font-variant-numeric:tabular-nums;}
  .tablewrap{max-height:320px; overflow:auto; margin-top:12px;}
  .appgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:12px;}
  .banner{border-radius:14px; padding:12px 14px; font-size:13.5px; line-height:1.45; background:rgba(255,149,0,.14);}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <button class="back-btn" id="back">&#8249; Spellbook</button>
    <p class="eyebrow" style="margin-top:10px;">strongtechnicalconsulting.com</p>
    <h1>What's trending</h1>
    <p class="sub">Page views across every app on the domain. Counted from a first-party
      beacon — no IP addresses, no user agents, no third-party tracker.</p>
  </div>

  <div class="banner" id="scopeNote" hidden></div>

  <div class="tiles" id="tiles"></div>

  <!-- ===== ranked bars: magnitude with identity on the axis ===== -->
  <div class="card">
    <div class="charthead chartheadrow" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <div>
        <h2>Ranked by the last 7 days</h2>
        <p class="muted" style="margin-top:3px;">Views, newest week. Change is against the 7 days before it.</p>
      </div>
    </div>
    <div class="chartbox" id="barBox"><svg id="barSvg" role="img" aria-label="Views per app over the last seven days"></svg>
      <div class="tip" id="barTip"></div>
    </div>
  </div>

  <!-- ===== time series: change over time, one y-axis, five series ===== -->
  <div class="card">
    <div class="charthead">
      <div>
        <h2>Views over time</h2>
        <p class="muted" style="margin-top:3px;" id="lineSub"></p>
      </div>
      <div class="controls">
        <div class="segmented" id="rangeSeg" role="group" aria-label="Time range">
          <button data-days="14" aria-pressed="false">14d</button>
          <button data-days="30" aria-pressed="true">30d</button>
          <button data-days="90" aria-pressed="false">90d</button>
        </div>
        <div class="segmented" id="viewSeg" role="group" aria-label="Chart or table">
          <button data-view="chart" aria-pressed="true">Chart</button>
          <button data-view="table" aria-pressed="false">Table</button>
        </div>
      </div>
    </div>
    <div class="chartbox" id="lineBox">
      <svg id="lineSvg" role="img" aria-label="Daily views per app"></svg>
      <div class="tip" id="lineTip"></div>
    </div>
    <!-- The table is the accessible equivalent of the chart, and it is also the
         relief the palette's light-mode contrast warning requires. Not a
         fallback — a peer view, reachable in one tap. -->
    <div class="tablewrap" id="lineTable" hidden></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="section-header">Per app</div>
  <div class="appgrid" id="appCards"></div>

  <p class="muted" id="foot" style="text-align:center; margin-top:8px;"></p>
</div>

<script>
(function(){
  "use strict";

  // Fixed slot order. An app's colour is a property of the app, not of where it
  // happens to rank today — so this list is the only thing that decides it.
  var APP_ORDER = ['landing','football','hopscotch','trip','spellbook'];
  var MAX_SERIES = 5;

  var state = { days: 30, view: 'chart', data: null, hidden: {}, admin: false };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n){ return (n||0).toLocaleString(); }
  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function colorFor(app){
    var i = APP_ORDER.indexOf(app);
    if (i < 0 || i >= MAX_SERIES) i = MAX_SERIES - 1; // never generate a hue
    return cssVar('--series-' + (i + 1));
  }
  function shortDate(iso){
    var d = new Date(iso + 'T00:00:00Z');
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', timeZone:'UTC' });
  }

  // "Nice" axis ceiling, so ticks land on readable numbers instead of 1,347.
  function niceMax(v){
    if (v <= 4) return 4;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var step = [1, 2, 2.5, 5, 10].find(function(s){ return v <= s * mag; }) || 10;
    return step * mag;
  }

  function el(tag, attrs, text){
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }

  function apps(){ return (state.data && state.data.apps) || []; }
  function visibleApps(){ return apps().filter(function(a){ return !state.hidden[a.app]; }); }
  function sliceSeries(a){
    var s = a.series || [];
    return s.slice(Math.max(0, s.length - state.days));
  }

  // ======================= ranked horizontal bars =======================
  function drawBars(){
    var svg = $('barSvg');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var rows = apps().slice().sort(function(x, y){ return y.views7 - x.views7; });
    if (!rows.length) return;

    var W = $('barBox').clientWidth || 600;
    var LABEL = Math.min(132, Math.max(96, Math.round(W * 0.23)));
    var VALUE = 74;
    var ROW = 34, BAR = 15, GAP = 2; // 2px surface gap between adjacent bars
    var H = rows.length * ROW + 8;
    var plotW = Math.max(40, W - LABEL - VALUE);
    var max = niceMax(Math.max.apply(null, rows.map(function(r){ return r.views7; }).concat([1])));

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('height', H);

    rows.forEach(function(r, i){
      var y = i * ROW + 4;
      var cy = y + (ROW - GAP) / 2;
      var len = Math.max(r.views7 > 0 ? 3 : 0, Math.round((r.views7 / max) * plotW));

      svg.appendChild(el('text', {
        x: LABEL - 10, y: cy + 4.5, 'text-anchor':'end',
        'font-size':'12.5', 'font-weight':'600', fill:'var(--viz-text)'
      }, r.icon ? (r.icon + '  ' + r.label) : r.label));

      // Track first, so a zero-view app still reads as a row rather than a gap.
      svg.appendChild(el('rect', {
        x: LABEL, y: cy - BAR/2, width: plotW, height: BAR, rx: 4, fill:'var(--viz-grid)'
      }));
      if (len > 0){
        // 4px rounded data-end, anchored to the baseline at x = LABEL.
        svg.appendChild(el('rect', {
          x: LABEL, y: cy - BAR/2, width: len, height: BAR, rx: 4,
          fill: colorFor(r.app), 'data-app': r.app
        }));
      }
      // Direct label on every bar — five marks, so this is selective, not noise.
      svg.appendChild(el('text', {
        x: LABEL + plotW + 8, y: cy + 4.5,
        'font-size':'12.5', 'font-weight':'700', fill:'var(--viz-text)',
        'font-variant-numeric':'tabular-nums'
      }, fmt(r.views7)));

      // Hit target spans the whole row, not just the drawn bar.
      var hit = el('rect', { x:0, y:y, width:W, height:ROW - GAP, fill:'transparent', 'data-row': i });
      hit.style.cursor = 'default';
      svg.appendChild(hit);
    });

    var tip = $('barTip');
    svg.onmousemove = function(ev){
      var target = ev.target.getAttribute('data-row');
      if (target == null){ tip.style.opacity = 0; return; }
      var r = rows[Number(target)];
      var d = r.trendPct;
      tip.innerHTML = '<div class="th">' + esc(r.label) + '</div>'
        + '<div class="tr"><span class="sw" style="background:' + colorFor(r.app) + '"></span>'
        + 'Last 7 days<span class="tv">' + fmt(r.views7) + '</span></div>'
        + '<div class="tr"><span style="width:9px"></span>Previous 7<span class="tv">' + fmt(r.views7Prev) + '</span></div>'
        + '<div class="tr"><span style="width:9px"></span>All time<span class="tv">' + fmt(r.totalViews) + '</span></div>'
        + (d == null ? '' : '<div class="tr"><span style="width:9px"></span>Change<span class="tv '
            + (d >= 0 ? 'delta up' : 'delta down') + '">' + (d >= 0 ? '+' : '') + d + '%</span></div>');
      place(tip, $('barBox'), ev);
    };
    svg.onmouseleave = function(){ tip.style.opacity = 0; };
  }

  function place(tip, box, ev){
    var b = box.getBoundingClientRect();
    var x = ev.clientX - b.left + 14, y = ev.clientY - b.top + 12;
    tip.style.opacity = 1;
    // Flip rather than overflow the card.
    if (x + tip.offsetWidth > b.width) x = ev.clientX - b.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > b.height) y = Math.max(0, b.height - tip.offsetHeight);
    tip.style.left = Math.max(0, x) + 'px';
    tip.style.top = y + 'px';
  }

  // ======================= multi-series line chart =======================
  function drawLines(){
    var svg = $('lineSvg');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var rows = visibleApps();
    var W = $('lineBox').clientWidth || 600;
    var H = 262;
    var M = { t: 12, r: 14, b: 26, l: 46 };
    var plotW = Math.max(40, W - M.l - M.r);
    var plotH = H - M.t - M.b;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('height', H);

    var dates = rows.length ? sliceSeries(rows[0]).map(function(d){ return d.date; })
                            : (apps()[0] ? sliceSeries(apps()[0]).map(function(d){ return d.date; }) : []);
    if (!dates.length) return;

    var peak = 0;
    rows.forEach(function(a){ sliceSeries(a).forEach(function(d){ if (d.views > peak) peak = d.views; }); });
    var max = niceMax(peak);
    var x = function(i){ return M.l + (dates.length === 1 ? plotW/2 : (i / (dates.length - 1)) * plotW); };
    var y = function(v){ return M.t + plotH - (v / max) * plotH; };

    // Recessive grid: horizontal only, four steps, no vertical rules.
    for (var t = 0; t <= 4; t += 1){
      var v = (max / 4) * t;
      svg.appendChild(el('line', {
        x1: M.l, x2: M.l + plotW, y1: y(v), y2: y(v),
        stroke:'var(--viz-grid)', 'stroke-width': t === 0 ? 1 : 1
      }));
      svg.appendChild(el('text', {
        x: M.l - 9, y: y(v) + 4, 'text-anchor':'end', 'font-size':'11',
        fill:'var(--viz-muted)', 'font-variant-numeric':'tabular-nums'
      }, t === 0 ? '0' : fmt(Math.round(v))));
    }

    // A handful of x labels, never one per day.
    var every = Math.max(1, Math.ceil(dates.length / 6));
    dates.forEach(function(d, i){
      if (i % every !== 0 && i !== dates.length - 1) return;
      svg.appendChild(el('text', {
        x: x(i), y: H - 8, 'text-anchor': i === dates.length - 1 ? 'end' : 'middle',
        'font-size':'11', fill:'var(--viz-muted)'
      }, shortDate(d)));
    });

    rows.forEach(function(a){
      var pts = sliceSeries(a);
      var path = pts.map(function(d, i){ return (i ? 'L' : 'M') + x(i) + ' ' + y(d.views); }).join(' ');
      svg.appendChild(el('path', {
        d: path, fill:'none', stroke: colorFor(a.app), 'stroke-width':'2',
        'stroke-linejoin':'round', 'stroke-linecap':'round'
      }));
      // A single day of data draws no line, so give it a point to be seen by.
      if (pts.length === 1){
        svg.appendChild(el('circle', { cx:x(0), cy:y(pts[0].views), r:4, fill: colorFor(a.app) }));
      }
    });

    // Crosshair layer, built once and moved rather than rebuilt per pointer move.
    var cross = el('line', {
      x1:0, x2:0, y1:M.t, y2:M.t + plotH, stroke:'var(--viz-axis)', 'stroke-width':'1', opacity:'0'
    });
    svg.appendChild(cross);
    var dots = rows.map(function(a){
      // 2px surface ring so overlapping markers stay countable.
      var c = el('circle', { r:4.5, fill: colorFor(a.app), stroke:'var(--surface-1)', 'stroke-width':'2', opacity:'0' });
      svg.appendChild(c);
      return c;
    });

    var tip = $('lineTip');
    function onMove(ev){
      var b = svg.getBoundingClientRect();
      var px = ((ev.clientX - b.left) / b.width) * W;
      var i = Math.round(((px - M.l) / plotW) * (dates.length - 1));
      i = Math.max(0, Math.min(dates.length - 1, i));
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', '1');
      var lines = rows.map(function(a, k){
        var pts = sliceSeries(a), v = pts[i] ? pts[i].views : 0;
        dots[k].setAttribute('cx', x(i)); dots[k].setAttribute('cy', y(v)); dots[k].setAttribute('opacity','1');
        return { label:a.label, app:a.app, v:v };
      }).sort(function(p, q){ return q.v - p.v; });
      tip.innerHTML = '<div class="th">' + esc(shortDate(dates[i])) + '</div>'
        + lines.map(function(l){
            return '<div class="tr"><span class="sw" style="background:' + colorFor(l.app) + '"></span>'
              + esc(l.label) + '<span class="tv">' + fmt(l.v) + '</span></div>';
          }).join('');
      place(tip, $('lineBox'), ev);
    }
    function onLeave(){
      cross.setAttribute('opacity','0');
      dots.forEach(function(d){ d.setAttribute('opacity','0'); });
      tip.style.opacity = 0;
    }
    svg.onmousemove = onMove;
    svg.onmouseleave = onLeave;
    svg.ontouchmove = function(ev){ if (ev.touches[0]) onMove(ev.touches[0]); };
    svg.ontouchend = onLeave;
  }

  function drawTable(){
    var rows = visibleApps();
    var dates = rows.length ? sliceSeries(rows[0]).map(function(d){ return d.date; }) : [];
    var head = '<tr><th>Date</th>' + rows.map(function(a){
      return '<th class="n">' + esc(a.label) + '</th>'; }).join('') + '<th class="n">Total</th></tr>';
    var body = dates.map(function(d, i){
      var vals = rows.map(function(a){ var p = sliceSeries(a)[i]; return p ? p.views : 0; });
      var sum = vals.reduce(function(x, y){ return x + y; }, 0);
      return '<tr><td>' + esc(shortDate(d)) + '</td>'
        + vals.map(function(v){ return '<td class="n">' + fmt(v) + '</td>'; }).join('')
        + '<td class="n"><b>' + fmt(sum) + '</b></td></tr>';
    }).reverse().join('');
    $('lineTable').innerHTML = '<table>' + head + body + '</table>';
  }

  function drawLegend(){
    var host = $('legend');
    host.innerHTML = apps().map(function(a){
      var on = !state.hidden[a.app];
      return '<button data-app="' + esc(a.app) + '" aria-pressed="' + on + '">'
        + '<span class="sw" style="background:' + colorFor(a.app) + '"></span>'
        + esc(a.label) + ' <span class="lv">' + fmt(a.views30 != null ? a.views30 : a.views7) + '</span></button>';
    }).join('');
  }

  function drawTiles(){
    var rows = apps();
    var v7 = rows.reduce(function(s, a){ return s + a.views7; }, 0);
    var p7 = rows.reduce(function(s, a){ return s + a.views7Prev; }, 0);
    var all = rows.reduce(function(s, a){ return s + a.totalViews; }, 0);
    var uniq = rows.reduce(function(s, a){ return s + (a.totalUniques || 0); }, 0);
    var top = rows.slice().sort(function(x, y){ return y.views7 - x.views7; })[0];
    var delta = p7 > 0 ? Math.round(((v7 - p7) / p7) * 100) : null;

    function tile(k, v, d){
      return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div>'
        + '<div class="d">' + d + '</div></div>';
    }
    $('tiles').innerHTML =
        tile('Views, last 7d', fmt(v7), delta == null ? 'no earlier week to compare'
          : '<span class="delta ' + (delta >= 0 ? 'up' : 'down') + '">' + (delta >= 0 ? '&#9650; +' : '&#9660; ')
            + delta + '%</span> vs previous 7')
      + tile('Trending now', top ? (top.icon || '') + ' ' + esc(top.label) : '—',
          top ? fmt(top.views7) + ' views this week' : 'nothing tracked yet')
      + tile('Views, all time', fmt(all), rows.length + ' apps tracked')
      + (state.admin ? tile('Visitors, all time', fmt(uniq), 'distinct devices, per day') : '');
  }

  function drawAppCards(){
    if (!state.admin){ $('appCards').innerHTML =
      '<div class="card"><p class="muted">Per-page and referrer detail is admin-only.</p></div>'; return; }
    $('appCards').innerHTML = apps().map(function(a){
      var paths = (a.topPaths || []).slice(0, 5);
      var refs = (a.topRefs || []).slice(0, 5);
      return '<div class="card">'
        + '<div style="display:flex; align-items:center; gap:8px;">'
        +   '<span class="sw" style="width:11px;height:11px;border-radius:3px;background:' + colorFor(a.app) + '"></span>'
        +   '<h2>' + esc(a.label) + '</h2></div>'
        + '<p class="muted" style="margin-top:6px;">' + fmt(a.totalViews) + ' views &middot; '
        +   fmt(a.totalUniques) + ' visitors &middot; rank #' + a.rank + '</p>'
        + (paths.length ? '<table style="margin-top:12px;"><tr><th>Top pages</th><th class="n">Views</th></tr>'
            + paths.map(function(p){ return '<tr><td>' + esc(p.path) + '</td><td class="n">'
              + fmt(p.views) + '</td></tr>'; }).join('') + '</table>' : '')
        + (refs.length ? '<table style="margin-top:12px;"><tr><th>Came from</th><th class="n">Hits</th></tr>'
            + refs.map(function(r){ return '<tr><td>' + esc(r.host) + '</td><td class="n">'
              + fmt(r.hits) + '</td></tr>'; }).join('') + '</table>'
            : '<p class="muted" style="margin-top:10px;">No external referrers yet.</p>')
        + '</div>';
    }).join('');
  }

  function renderAll(){
    drawTiles(); drawBars(); drawLegend();
    $('lineSub').textContent = 'Daily views, last ' + state.days + ' days. One y-axis, shared by every app.';
    if (state.view === 'chart'){ $('lineBox').hidden = false; $('lineTable').hidden = true; drawLines(); }
    else { $('lineBox').hidden = true; $('lineTable').hidden = false; drawTable(); }
    drawAppCards();
  }

  // ---- wiring ------------------------------------------------------------
  $('back').addEventListener('click', function(){ window.location.href = '/'; });
  $('rangeSeg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-days]'); if (!b) return;
    state.days = Number(b.getAttribute('data-days'));
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
      x.setAttribute('aria-pressed', String(x === b)); });
    renderAll();
  });
  $('viewSeg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-view]'); if (!b) return;
    state.view = b.getAttribute('data-view');
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
      x.setAttribute('aria-pressed', String(x === b)); });
    renderAll();
  });
  $('legend').addEventListener('click', function(e){
    var b = e.target.closest('button[data-app]'); if (!b) return;
    var app = b.getAttribute('data-app');
    // Hiding a series must not renumber the colours of the ones left.
    state.hidden[app] = !state.hidden[app];
    renderAll();
  });

  var rt = null;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ if (state.data) renderAll(); }, 140);
  });
  // Re-step the palette when the OS flips theme mid-session.
  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function(){ if (state.data) renderAll(); });
  }

  // Try the admin view first; fall back to the public numbers. The admin route
  // 404s for non-admins by design, so a 404 here is a normal outcome.
  function load(){
    return fetch('/api/admin/stats').then(function(r){
      if (r.ok) return r.json().then(function(d){ state.admin = true; return d; });
      return fetch('/api/stats/public').then(function(r2){
        if (!r2.ok) throw new Error('Could not load stats.');
        return r2.json().then(function(d){
          state.admin = false;
          $('scopeNote').hidden = false;
          $('scopeNote').textContent = 'Showing public view counts. Sign in as the admin for visitors, '
            + 'top pages and referrers.';
          // The public payload carries a sparkline rather than a full series;
          // normalise it so one renderer handles both shapes.
          d.apps = d.apps.map(function(a){
            return Object.assign({}, a, {
              series: (a.spark || []).map(function(v, i, arr){
                var day = new Date(Date.now() - (arr.length - 1 - i) * 86400000);
                return { date: day.toISOString().slice(0,10), views: v, uniques: 0 };
              }),
              views7Prev: 0, totalUniques: 0, topPaths: [], topRefs: []
            });
          });
          return d;
        });
      });
    });
  }

  load().then(function(d){
    state.data = d;
    if (state.days > d.days) state.days = d.days;
    renderAll();
    $('foot').textContent = 'Counts start from the day the beacon shipped — earlier traffic was never recorded.';
  }).catch(function(e){
    $('tiles').innerHTML = '<div class="card"><p>' + esc(e.message) + '</p></div>';
  });
})();
</script>
</body></html>
